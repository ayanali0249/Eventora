name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel a superseded run on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  server:
    name: Server (checks + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: eventora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d eventora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-password
      PGDATABASE: eventora
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Syntax check every source file
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

      - name: API docs match the registered routes
        run: npm run check:openapi

      - name: Unit tests (planner rules and ranking)
        run: npm test

      - name: Response envelope guard (no legacy "error:" keys)
        run: |
          if grep -rnE "json\(\{[^}]*\berror:" controllers routes middleware index.js; then
            echo "Use { success:false, message } instead of an error: key"; exit 1
          fi

      - name: Apply schema (twice - it must be idempotent)
        run: |
          psql -v ON_ERROR_STOP=1 -f db/schema.sql
          psql -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Load demo data
        run: psql -v ON_ERROR_STOP=1 -f db/seed.sql

      - name: Start the API
        env:
          PORT: 5000
          DATABASE_URL: postgresql://postgres:ci-password@localhost:5432/eventora
          JWT_SECRET: ci-only-secret-not-used-anywhere-else
          CLIENT_URL: http://localhost:5173
        run: |
          node index.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/api/v1/health && exit 0
            sleep 1
          done
          echo "API did not become healthy in 30s"; cat server.log; exit 1

      - name: Smoke test
        run: npm run smoke

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

  client:
    name: Client (lint ratchet + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Lint (fails only on NEW problems vs lint-baseline.json)
        run: npm run lint:ci

      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        run: |
          printf 'POSTGRES_PASSWORD=ci\nJWT_SECRET=ci\n' > .env
          docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
